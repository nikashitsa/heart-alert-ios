<!doctype html>
<!--
  Layout of every store screenshot. The `frame` lane fills in the double-brace placeholders
  for each screenshot and renders this page with headless Chrome at the device's App Store
  size. Captions come from <locale>/keyword.strings and <locale>/title.strings. The device
  itself is drawn here rather than by frameit, which has no frames for current iPhones/iPads.
-->
<html lang="{{lang}}">
<meta charset="utf-8">
<style>
  :root {
    --background: #FFFFFF;
    --keyword: #FF0000;
    --title: #121212;
    --bezel: #1C1C1E;
    /* Caption size, relative to the Android layout's 1440px width. */
    --scale: {{scale}};
    /* Width / height of the raw capture. */
    --ratio: {{ratio}};
  }
  html, body {
    margin: 0;
    width: {{width}}px;
    height: {{height}}px;
    overflow: hidden;
    background: var(--background);
  }
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    box-sizing: border-box;
    padding: calc(120px * var(--scale)) calc(90px * var(--scale)) calc(90px * var(--scale));
    text-align: center;
    font-family: system-ui, -apple-system, "Helvetica Neue", sans-serif;
  }
  .keyword {
    color: var(--keyword);
    font-weight: 700;
    font-size: calc(104px * var(--scale));
    line-height: 1.15;
  }
  .title {
    margin-top: calc(16px * var(--scale));
    color: var(--title);
    font-weight: 500;
    font-size: calc(76px * var(--scale));
    line-height: 1.25;
  }
  /* The device takes whatever height the caption leaves, so a two-line title shrinks it.
     Its width follows from that height, so the screen keeps the capture's exact ratio. */
  .device {
    flex: 1;
    min-height: 0;
    width: 100%;
    margin-top: calc(90px * var(--scale));
    container-type: size;
    display: flex;
    justify-content: center;
  }
  .phone {
    --b: calc({{bezel}}px * var(--scale));
    width: calc((100cqh - 2 * var(--b)) * var(--ratio) + 2 * var(--b));
    height: 100cqh;
    box-sizing: border-box;
    padding: var(--b);
    border-radius: calc({{radius}}px * var(--scale));
    background: var(--bezel);
  }
  .phone img {
    display: block;
    width: 100%;
    height: 100%;
    border-radius: calc({{radius}}px * var(--scale) - var(--b));
  }
</style>
<div class="keyword">{{keyword}}</div>
<div class="title">{{title}}</div>
<div class="device"><div class="phone"><img src="{{screenshot}}" alt=""></div></div>
</html>
